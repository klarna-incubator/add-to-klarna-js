name: Publish to npm

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    # Only run when triggered manually or after a successful CI run on master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # When triggered by workflow_run, check out the exact commit that
          # produced the green CI run instead of the latest master.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version is already published
        id: version-check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION already published — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$PKG_NAME@$PKG_VERSION not on npm — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version-check.outputs.should_publish == 'true'
        run: yarn build

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        # Clear the placeholder NODE_AUTH_TOKEN that actions/setup-node exports
        # when registry-url is set. With it present (even as the placeholder
        # `XXXXX-XXXXX-XXXXX-XXXXX`), npm uses classic token auth instead of
        # initiating the OIDC token exchange and Trusted Publishing silently
        # fails. See actions/setup-node#1440.
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: steps.version-check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-check.outputs.version }}
          name: v${{ steps.version-check.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
